// ===== ЛОГИКА =====
let questions=[], index=0, answered=false;
let mode="learn", correctCount=0;

function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}


function startLearn(){
  mode="learn";
  questions=shuffle([...allQuestions]);
  index=0; load();
}
function startExam(){
  mode="exam";
  questions=shuffle([...allQuestions]).slice(0,20);
  index=0; correctCount=0; load();
}

function load(){
  answered=false;
  document.getElementById("result").textContent="";
  document.getElementById("next").style.display="none";
  const q=questions[index];
  document.getElementById("term").textContent=q.term;
  document.getElementById("counter").textContent=
    mode==="exam"?`Вопрос ${index+1} из 20`:`Термин ${index+1}`;
  const a=document.getElementById("answers");
  a.innerHTML="";
  q.answers.forEach((t,i)=>{
    const b=document.createElement("button");
    b.textContent=t;
    b.onclick=()=>answer(b,i);
    a.appendChild(b);
  });
}

function answer(btn,i){
  if(answered) return;
  answered=true;
  const q=questions[index];
  document.querySelectorAll("#answers button").forEach((b,j)=>{
    b.disabled=true;
    if(j===q.correct) b.classList.add("correct");
    if(j===i && j!==q.correct) b.classList.add("wrong");
  });
  if(i===q.correct) correctCount++;
  document.getElementById("result").textContent=i===q.correct?"✅ Верно":"❌ Неверно";
  document.getElementById("next").style.display="block";
}

function nextQuestion(){
  index++;
  if(mode==="exam" && index===questions.length){
    alert(`Экзамен окончен\nПравильных: ${correctCount} из 20\n`+
          (correctCount>=17?"✅ СДАЛ":"❌ НЕ СДАЛ"));
    startLearn(); return;
  }
  if(index>=questions.length) index=0;
  load();
}

// старт
