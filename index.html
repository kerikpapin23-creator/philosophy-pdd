<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Философия — билеты</title>

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root {
  --bg: #f2f2f7;
  --card: #ffffff;
  --text: #000000;
  --button: #007aff;
  --correct: #34c759;
  --wrong: #ff3b30;
}

.dark {
  --bg: #1c1c1e;
  --card: #2c2c2e;
  --text: #ffffff;
  --button: #0a84ff;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding: 20px;
}

.card {
  background: var(--card);
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.15);
}

.term {
  font-size: 26px;
  font-weight: 700;
  margin-bottom: 20px;
  text-align: center;
}

button {
  width: 100%;
  padding: 14px;
  margin: 8px 0;
  font-size: 16px;
  border-radius: 12px;
  border: none;
  background: var(--button);
  color: white;
}

button.correct { background: var(--correct); }
button.wrong { background: var(--wrong); }
button:disabled { opacity: 0.8; }

#result {
  text-align: center;
  font-size: 20px;
  margin-top: 15px;
}

#next {
  margin-top: 20px;
  background: #8e8e93;
}

.counter {
  text-align: center;
  margin-top: 10px;
  opacity: 0.7;
}

.theme-toggle {
  text-align: right;
  margin-bottom: 10px;
}

.theme-toggle button {
  width: auto;
  padding: 6px 12px;
  font-size: 14px;
  background: none;
  color: var(--text);
}
</style>
</head>

<body>

<div class="theme-toggle">
  <button onclick="toggleTheme()">🌙 / ☀️</button>
</div>

<div class="card">
  <div class="term" id="term"></div>
  <div id="answers"></div>
  <div id="result"></div>
  <button id="next" onclick="nextQuestion()" style="display:none;">
    Следующий термин
  </button>
  <div class="counter" id="counter"></div>
</div>

<script>
// === ТЕМЫ ===
function toggleTheme() {
  document.body.classList.toggle("dark");
  localStorage.setItem("theme",
    document.body.classList.contains("dark") ? "dark" : "light"
  );
}

if (localStorage.getItem("theme") === "dark") {
  document.body.classList.add("dark");
}

// === ВОПРОСЫ ===
const questions = [
{ term:"Онтология", answers:["Учение о бытии","Учение о познании","Учение о морали"], correct:0 },
{ term:"Гносеология", answers:["Учение о познании","Учение о бытии","Учение о красоте"], correct:0 },
{ term:"Метафизика", answers:["Учение о предельных основаниях реальности","Учение о морали","Учение о языке"], correct:0 },
{ term:"Диалектика", answers:["Учение о развитии через противоречия","Учение о душе","Учение о законах логики"], correct:0 },
{ term:"Этика", answers:["Учение о морали","Учение о красоте","Учение о государстве"], correct:0 },

{ term:"Теоцентризм", answers:["Бог как центр бытия","Человек как центр мира","Природа как абсолют"], correct:0 },
{ term:"Провиденциализм", answers:["История как проявление божественного замысла","История как хаос","История как экономический процесс"], correct:0 },
{ term:"Пантеизм", answers:["Отождествление Бога и природы","Отрицание Бога","Бог вне мира"], correct:0 },
{ term:"Гуманизм", answers:["Признание ценности человека","Отрицание личности","Превосходство государства"], correct:0 },
{ term:"Агностицизм", answers:["Непознаваемость сущности мира","Абсолютное знание","Религиозная вера"], correct:0 },

{ term:"Релятивизм", answers:["Относительность истины","Абсолютная истина","Научный метод"], correct:0 },
{ term:"Деизм", answers:["Бог — творец, не вмешивающийся в мир","Бог тождествен природе","Отрицание Бога"], correct:0 },
{ term:"Скептицизм", answers:["Сомнение в достоверности знания","Вера в разум","Религиозное учение"], correct:0 },
{ term:"Экстаз", answers:["Выход за пределы обычного сознания","Рациональное мышление","Логический вывод"], correct:0 },
{ term:"Монада", answers:["Неделимая духовная субстанция","Материальная частица","Форма познания"], correct:0 },

{ term:"Воля", answers:["Способность к целенаправленному действию","Чувственное восприятие","Форма логики"], correct:0 },
{ term:"Идолы разума", answers:["Ложные формы мышления","Категории разума","Истинные идеи"], correct:0 },
{ term:"Реализм", answers:["Признание реальности универсалий","Отрицание универсалий","Скептицизм"], correct:0 },
{ term:"Номинализм", answers:["Отрицание реальности универсалий","Признание идей","Материализм"], correct:0 },
{ term:"Универсалия", answers:["Общее понятие","Единичная вещь","Чувственный образ"], correct:0 },

{ term:"Креационизм", answers:["Учение о сотворении мира Богом","Отрицание Бога","Эволюционизм"], correct:0 },
{ term:"Категории", answers:["Фундаментальные формы мышления","Социальные роли","Эмоциональные состояния"], correct:0 },
{ term:"Нус", answers:["Разум как высшая способность","Телесное чувство","Форма материи"], correct:0 },
{ term:"Сверхчеловек", answers:["Идеал преодоления человека","Религиозный идеал","Политический лидер"], correct:0 },
{ term:"Сциентизм", answers:["Абсолютизация науки","Отрицание науки","Религиозное мировоззрение"], correct:0 }
];

let current = 0;
let answered = false;

function loadQuestion() {
  answered = false;
  document.getElementById("result").textContent = "";
  document.getElementById("next").style.display = "none";

  const q = questions[current];
  document.getElementById("term").textContent = q.term;
  document.getElementById("counter").textContent =
    `Термин ${current + 1} из ${questions.length}`;

  const answersDiv = document.getElementById("answers");
  answersDiv.innerHTML = "";

  q.answers.forEach((text, index) => {
    const btn = document.createElement("button");
    btn.textContent = text;
    btn.onclick = () => selectAnswer(btn, index);
    answersDiv.appendChild(btn);
  });
}

function selectAnswer(button, index) {
  if (answered) return;
  answered = true;

  const q = questions[current];
  const buttons = document.querySelectorAll("#answers button");

  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.correct) btn.classList.add("correct");
    if (i === index && i !== q.correct) btn.classList.add("wrong");
  });

  document.getElementById("result").textContent =
    index === q.correct ? "✅ Верно" : "❌ Неверно";

  document.getElementById("next").style.display = "block";
}

function nextQuestion() {
  current = (current + 1) % questions.length;
  loadQuestion();
}

loadQuestion();
</script>

</body>
</html>
